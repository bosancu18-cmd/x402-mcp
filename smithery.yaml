# Smithery configuration: https://smithery.ai/docs/build/project-config
name: x402-mcp
displayName: x402-mcp
description: >
  Pay for HTTP APIs and charge for your own with x402 USDC micropayments on Base.
  Discover Bazaar services, probe 402 terms, pay-and-fetch protected resources,
  and run US city open-data property compliance. Public tools need no API key.
version: 1.30.0
license: MIT
homepage: https://x402-mcp.onrender.com
repository: https://github.com/kwizzlesurp10-ctrl/x402-mcp
documentation: https://github.com/kwizzlesurp10-ctrl/x402-mcp/blob/master/README.md
categories:
  - payments
  - crypto
  - developer-tools
  - data
tags:
  - x402
  - usdc
  - base
  - micropayments
  - mcp
  - coinbase
  - bazaar
  - compliance
runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: "."
startCommand:
  type: http
  configSchema:
    type: object
    required: []
    properties:
      X402_PAY_TO_ADDRESS:
        type: string
        title: Seller pay-to address
        description: >
          Optional 0x USDC address on Base for inbound x402 sales.
          Public discover/probe/city.sample tools work without this.
      EVM_PRIVATE_KEY:
        type: string
        title: Buyer wallet private key
        description: >
          Optional dedicated burner key for x402.pay_and_fetch and city.check.
          Never use a main wallet. Leave blank on public seller hosts.
        x-from:
          header: x-evm-private-key
  exampleConfig: {}
